<!doctype html>
<html lang="{{lang}}">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Invitation page reached through the /invite/closedbeta link; not meant for search results. -->
    <meta name="robots" content="noindex" />
    <title>{{pageTitle}}</title>
    <link rel="stylesheet" href="{{root}}src/output.css" />
    <link rel="stylesheet" href="{{root}}src/theme.css" />
    <link rel="stylesheet" href="{{root}}src/sections.css" />
    <link rel="icon" type="image/jpeg" href="{{root}}src/img/skeep-isotip-v1.2@192.jpg" />
    <link rel="canonical" href="https://www.skeep.me/{{lang}}/{{pageUrl}}" />
    {{{hreflang}}}
</head>

<body>
    <!-- Nav — fixed, transparent, always visible regardless of scroll -->
    <header class="site-nav fixed inset-x-0 top-0 z-50">
        <nav aria-label="Global" class="flex items-center justify-between px-6 lg:px-8" style="height: 60px;">
            <div class="flex lg:flex-1">
                <a href="./" class="-m-1.5 p-1.5">
                    <span class="sr-only">skeep</span>
                    <img src="{{root}}src/img/skeep-isotip-v1.2@512.png" alt="" class="h-8 w-auto" />
                </a>
            </div>
            <div class="flex flex-1 justify-end">
                <button type="button" class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-menu">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
            </div>
        </nav>
        <hr class="border-gray-200 dark:border-gray-700" />
    </header>

    {{> menu}}

    <!-- Same hero as the landing page, without the scroll cue: there is nothing below it. -->
    <div class="relative isolate bg-stone-950 hero-fixed overflow-hidden">
        <div aria-hidden="true" class="absolute inset-0 -z-10">
            <div style="
              position: absolute;
              inset: 0;
              background-image: linear-gradient(135deg, #466EC3 0%, #8C44D4 75%, #D42A44 100%);
            "></div>
        </div>

        <div class="relative isolate px-6 pt-14 lg:px-8 hero-content-block">
            <div class="mx-auto max-w-2xl">
                <div class="text-center">
                    <img class="mx-auto my-10" src="{{root}}src/img/skeep-layerlogo-white.png" width="40%" alt="skeep">
                    <p class="hero-tagline font-body tracking-tight text-balance text-white">{{invite}}</p>

                    <p class="hero-badges-label">{{openOnMobile}}</p>
                    <div class="hero-badges">
                        <div class="store-badge">
                            <svg class="store-badge__icon" width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                <path fill="currentColor" d="M17.05 12.536c-.03-2.36 1.93-3.49 2.02-3.548-1.1-1.606-2.81-1.827-3.42-1.853-1.454-.148-2.84.856-3.578.856-.74 0-1.882-.836-3.096-.812-1.594.024-3.064.928-3.884 2.353-1.657 2.87-.424 7.12 1.19 9.45.79 1.14 1.73 2.418 2.965 2.372 1.19-.047 1.64-.77 3.078-.77s1.842.77 3.1.746c1.284-.024 2.096-1.163 2.882-2.31.907-1.325 1.28-2.61 1.298-2.676-.028-.013-2.492-.957-2.555-3.808Zm-2.393-7.01c.657-.797 1.1-1.9.98-3.002-.947.038-2.093.63-2.774 1.427-.61.706-1.144 1.83-1.002 2.91 1.055.082 2.14-.536 2.796-1.335Z"/>
                            </svg>
                            <div class="store-badge__text">
                                <span class="store-badge__name">App Store</span>
                            </div>
                        </div>

                        <div class="store-badge">
                            <svg class="store-badge__icon store-badge__icon--play" width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                <path d="M3.6 2.6c-.35.36-.55.9-.55 1.6v15.6c0 .7.2 1.24.55 1.6l.1.09L12.6 12v-.2L3.7 2.5l-.1.1Z" fill="#4285F4"/>
                                <path d="M15.6 15 12.6 12v-.2l3-3.02 3.5 2c.83.47 1.32.87 1.32 1.44.53.57-.36.97-1.32 1.44l-3.5 1.99Z" fill="#EA4335"/>
                                <path d="M15.6 9 12.6 12l-9-9.3c.3-.32.86-.36 1.5 0L15.6 9Z" fill="#FBBC04"/>
                                <path d="M15.6 15l-11.5 6.3c-.63.36-1.2.32-1.5 0l9-9.3 4 3Z" fill="#34A853"/>
                            </svg>
                            <div class="store-badge__text">
                                <span class="store-badge__name">Google Play</span>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    {{> menu-script}}
</body>

</html>
