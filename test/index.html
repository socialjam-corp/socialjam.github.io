<!doctype html>
<!-- Shared test link: www.skeep.me/test sends each visitor to the right place for their device.
     Hand-written (not generated by _src/build.js). Change the destinations in TARGETS below,
     and the fallback links at the bottom to match. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>You have been invited to the Skeep closed Beta!</title>
<!-- Link preview (WhatsApp, Telegram, iMessage, X…). Their crawlers don't run the redirect below,
     so the preview comes from these tags. Image URLs must be absolute, and WhatsApp drops images
     over ~300 KB: that's why this is a JPEG copy of skeepIcon_preview.png (370 KB as PNG). -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="skeep" />
<meta property="og:url" content="https://www.skeep.me/test/" />
<meta property="og:title" content="You have been invited to the Skeep closed Beta!" />
<meta property="og:image" content="https://www.skeep.me/src/img/skeepIcon_preview.jpg" />
<meta property="og:image:type" content="image/jpeg" />
<meta property="og:image:width" content="800" />
<meta property="og:image:height" content="800" />
<meta property="og:image:alt" content="The skeep logo" />
<!-- "summary" is X's square-thumbnail card; the large card would crop this square image to 2:1. -->
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="You have been invited to the Skeep closed Beta!" />
<meta name="twitter:image" content="https://www.skeep.me/src/img/skeepIcon_preview.jpg" />
<script>
(function () {
  var TARGETS = {
    ios: 'https://testflight.apple.com/join/xgrE5hS5',
    android: 'https://play.google.com/store/apps/details?id=com.davidauladell.skeep',
    // The Closed Beta invitation page (built from _src/pages/beta.html); its root redirect
    // picks the visitor's language.
    pc: '../beta.html'
  };

  var ua = navigator.userAgent || '';
  // iPadOS 13+ reports itself as a Mac; a Mac with a touchscreen is really an iPad.
  var isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(ua);
  var target = isIOS ? TARGETS.ios : isAndroid ? TARGETS.android : TARGETS.pc;

  // replace() keeps this router out of the back history, so "back" doesn't bounce here again.
  location.replace(target);
})();
</script>
<style>body { background: #252525; color: #E2E3E4; font-family: sans-serif; text-align: center; padding-top: 30vh; } a { color: #7B9BE0; }</style>
</head>
<body>
<!-- Only visible if the redirect doesn't run (scripts off, or a detection miss the visitor can fix by hand). -->
<p><a href="https://testflight.apple.com/join/xgrE5hS5">iPhone / iPad</a> · <a href="https://play.google.com/store/apps/details?id=com.davidauladell.skeep">Android</a> · <a href="../beta.html">PC</a></p>
</body>
</html>
